<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f2eb"><meta name="description" content="Real NISAR radar browse, transparent data limits, and testable questions about El Niño, land and water."><title>The Two-Faced Pacific - A radar observatory</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M16%202A14%2014%200%200%200%202%2016c5-5%209-5%2014%200S25%2021%2030%2016A14%2014%200%200%200%2016%202Z%22%20fill%3D%22%23146db8%22%2F%3E%3Cpath%20d%3D%22M2%2016a14%2014%200%200%200%2028%200c-5%205-9%205-14%200S7%2011%202%2016Z%22%20fill%3D%22%23c34400%22%2F%3E%3C%2Fsvg%3E"></head>
<body><div id="launch-prelude" class="launch-prelude" role="status" aria-live="polite" aria-label="Preparing the Pacific observatory"><div class="launch-stars" aria-hidden="true"></div><div class="launch-orbit" aria-hidden="true"><span class="launch-world"></span><span class="launch-satellite"></span></div><div class="launch-copy"><strong>Launching the Pacific observatory</strong><span>Following a signal from sea to shore</span></div></div><div id="root"></div><noscript><p>This application needs JavaScript. Read the evidence and sources in the project documentation.</p></noscript><script type="module" src="/src/main.tsx"></script></body>
<style>
.launch-prelude{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:#0a1020;color:#e9eefc;opacity:1;transition:opacity .45s ease,visibility .45s ease}.launch-prelude.is-leaving{opacity:0;visibility:hidden;pointer-events:none}.launch-stars,.launch-stars:before,.launch-stars:after{position:absolute;inset:0;background-image:radial-gradient(circle at 18% 24%,#e9eefc 0 1px,transparent 1.5px),radial-gradient(circle at 76% 18%,#e9eefc 0 1px,transparent 1.5px),radial-gradient(circle at 64% 78%,#e9eefc 0 1px,transparent 1.5px),radial-gradient(circle at 31% 72%,#e9eefc 0 1px,transparent 1.5px);background-size:280px 230px,340px 310px,420px 360px,510px 470px;opacity:.38}.launch-stars:before,.launch-stars:after{content:"";transform:scale(1.35);opacity:.2;animation:launch-drift 12s linear infinite}.launch-stars:after{transform:scale(1.7);opacity:.12;animation-duration:18s;animation-direction:reverse}.launch-orbit{position:relative;width:170px;height:170px;border:1px solid rgba(233,238,252,.25);border-radius:50%;box-shadow:0 0 70px rgba(20,109,184,.25);animation:launch-float 3s ease-in-out infinite}.launch-orbit:before,.launch-orbit:after{content:"";position:absolute;inset:18px;border:1px solid rgba(20,109,184,.45);border-radius:50%;transform:rotate(58deg) scaleY(.42)}.launch-orbit:after{inset:-12px;border-color:rgba(195,68,0,.4);transform:rotate(-28deg) scaleY(.35)}.launch-world{position:absolute;inset:52px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#e9eefc 0 4%,#146db8 5% 48%,#0f182c 72%);box-shadow:0 0 24px rgba(20,109,184,.7)}.launch-world:after{content:"";position:absolute;inset:18px 5px 8px 20px;border:2px solid rgba(233,238,252,.5);border-left-color:transparent;border-radius:50%;transform:rotate(-24deg)}.launch-satellite{position:absolute;top:17px;left:77px;width:16px;height:9px;border-radius:2px;background:#c34400;box-shadow:-14px 0 0 -2px #146db8,14px 0 0 -2px #146db8;transform-origin:8px 68px;animation:launch-orbit 4s linear infinite}.launch-satellite:after{content:"";position:absolute;left:7px;top:-5px;width:2px;height:5px;background:#e9eefc}.launch-copy{position:absolute;top:calc(50% + 118px);display:grid;gap:6px;text-align:center;padding:0 24px}.launch-copy strong{font:650 1rem/1.3 system-ui,sans-serif;letter-spacing:.02em}.launch-copy span{color:rgba(233,238,252,.7);font:400 .78rem/1.4 system-ui,sans-serif}.launch-copy:after{content:"";width:54px;height:3px;margin:8px auto 0;border-radius:99px;background:#c34400;animation:launch-scan 1.3s ease-in-out infinite}@keyframes launch-orbit{to{transform:rotate(360deg)}}@keyframes launch-float{50%{transform:translateY(-7px)}}@keyframes launch-drift{to{transform:rotate(8deg) scale(1.35)}}@keyframes launch-scan{50%{width:110px;opacity:.55}}@media(prefers-reduced-motion:reduce){.launch-stars:before,.launch-stars:after,.launch-orbit,.launch-satellite,.launch-copy:after{animation:none}.launch-prelude{transition:none}}
